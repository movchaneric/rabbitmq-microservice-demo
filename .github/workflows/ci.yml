name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      order-service: ${{ steps.filter.outputs.order-service }}
      gateway: ${{ steps.filter.outputs.gateway }}
      inventory-service: ${{ steps.filter.outputs.inventory-service }}
      notification-service: ${{ steps.filter.outputs.notification-service }}
      dead-letter-service: ${{ steps.filter.outputs.dead-letter-service }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            order-service:
              - 'services/order-service/**'
            gateway:
              - 'gateway/**'
            inventory-service:
              - 'services/inventory-service/**'
            notification-service:
              - 'services/notification-service/**'
            dead-letter-service:
              - 'services/dead-letter-service/**'

  order-service:
    needs: changes
    if: needs.changes.outputs.order-service == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/service-ci.yml
    with:
      service: order-service
      path: services/order-service

  gateway:
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/service-ci.yml
    with:
      service: gateway

  inventory-service:
    needs: changes
    if: needs.changes.outputs.inventory-service == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/service-ci.yml
    with:
      service: inventory-service
      path: services/inventory-service

  notification-service:
    needs: changes
    if: needs.changes.outputs.notification-service == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/service-ci.yml
    with:
      service: notification-service
      path: services/notification-service

  dead-letter-service:
    needs: changes
    if: needs.changes.outputs.dead-letter-service == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/service-ci.yml
    with:
      service: dead-letter-service
      path: services/dead-letter-service
