name: order-service CI

on:
  push:
    branches:
      - main
    paths:
      - "order-service/**"
  pull_request:
    paths:
      - "order-service/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: order-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test
