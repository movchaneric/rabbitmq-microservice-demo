services:
  rabbitmq1:
    image: rabbitmq:3-management
    hostname: rabbitmq1
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_ERLANG_COOKIE: "ERIC_SHARED"
    networks: [rabbitmq-cluster]
  rabbitmq2:
    image: rabbitmq:3-management
    hostname: rabbitmq2
    environment:
      RABBITMQ_ERLANG_COOKIE: "ERIC_SHARED"
    networks: [rabbitmq-cluster]
    depends_on: [rabbitmq1]
  rabbitmq3:
    image: rabbitmq:3-management
    hostname: rabbitmq3
    environment:
      RABBITMQ_ERLANG_COOKIE: "ERIC_SHARED"
    networks: [rabbitmq-cluster]
    depends_on: [rabbitmq1]

networks:
  rabbitmq-cluster:
    driver: bridge
